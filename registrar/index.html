                    alt="Banner principal, muestra gatito jugando cartas, llorando, perdiendo" />
                <div class="letrabanner">
                    BARAJA
                </div>
                <span id="letrabanner2">
                    BIEN
                </span>
            </div>
        </div>
  
        </div>

    </div>


    <div class="separador">
        <nav class="menu">
            <ul>
                <li class="opcionPadre"><a href="./index.html">Inicio</a></li>

                <li class="opcionPadre">Nuevos Productos</li>
                <li class="opcionPadre"><a href="#productos">Productos</a>
                    <ul>
                        <li class="subopciones">Mitos y Leyendas</li>

            </ul>
        </nav>

    <form method="post" id="formulario_registro">
    <div class="container">
        <div class="row">
      
            <h2 class="mb-3">Registrar</h2>
              
            <div class="mb-3" id="mensaje">

            </div>
            
            <div class="col-md-4">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuario</label>
                    <input type="text" id="usuario" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="clave" class="form-label">Contraseña</label>
                    <input type="password" id="contraseña" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="clave2" class="form-label">Validar Contraseñas</label>
                    <input type="password" id="contraseña2" class="form-control">
                </div>
            </div>

            <div class="col-md-4">


                <div class="mb-3">
                    <label for="nombres" class="form-label">Nombres</label>
                    <input type="text" id="nombres" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="apellido_paterno" class="form-label">Apellido Paterno</label>
                    <input type="text" id="apellido_paterno" class="form-control">
                </div>


                <div class="mb-3">
                    <label for="apellido_materno" class="form-label">Apellido Materno</label>
                    <input type="text" id="apellido_materno" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="fecha_nacimiento" class="form-label">Fecha Nacimiento</label>
                    <input type="date" id="fecha_nacimiento" class="form-control">
                </div>




            </div>

            <div class="col-md-4">

                <div class="mb-3">
                    <label for="edad" class="form-label">Edad</label>
                    <input type="text" id="edad" class="form-control" readonly>
                </div>
                <div class="mb-3">

                    <label for="ciudad" class="form-label">Ciudad</label>
                    <input type="text" id="ciudad" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="direccion" class="form-label">Direccion</label>
                    <input type="text" id="direccion" class="form-control">
                </div>



            </div>
            <div class="row justify-content-center">
                <div class="col-md-3">
                    <div class="mb-1">
                        <button class="btn btn-primary w-100" id="registrar">Registrar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    </div>
    </form>

</body>

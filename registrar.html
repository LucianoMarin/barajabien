</head>

<body>


    <main class="">

        <div class="banner">
            <div id="dibujo">
                <div id="contenedor_banner">
                    <img src="./assets/images/banner/principal.png" id="tam_banner"
                        alt="Banner principal, muestra gatito jugando cartas, llorando, perdiendo" />
                    <div class="letrabanner">
                        BARAJA
                    </div>
                    <span id="letrabanner2">
                        BIEN
                    </span>
                </div>
            </div>
            <div id="buscador_campo"><input type="text" placeholder="Ej: cartas pokemon" id="buscador">
                <button id="btn_buscar" regostrar>Buscar</button>
            </div>

        </div>


        <div class="separador">
            <nav class="menu">
                <ul>
                    <li class="opcionPadre"><a href="./index.html">Inicio</a></li>

                    <li class="opcionPadre">Nuevos Productos</li>
                    <li class="opcionPadre"><a href="#productos">Productos</a>
                        <ul>
                            <li class="subopciones">Mitos y Leyendas</li>
                            <li class="subopciones">Pokemon</li>

                </ul>
            </nav>



        </div>


        <div class="container d-flex justify-content-center">

            <div class="col-md-8">

                <h1 class="text-center mb-4">Registro</h1>
                    <div class="mensaje"></div>

                <form action="" method="post" id="formulario_registro">

                    <div class="row">
                        <!-- COLUMNA 1 -->
                        <div class="col-md-6">
                            <label>Usuario</label>
                            <input type="text" name="usuario" class="form-control" required>

                            <label>Contraseña</label>
                            <input type="password" name="clave1" class="form-control" required>

                            <label>Validar Contraseña</label>
                            <input type="password" name="clave2" class="form-control" required>

                            <label>Primer nombre</label>
                            <input type="text" name="primer_nombre" class="form-control" required>

                            <label>Segundo nombre</label>
                            <input type="text" name="segundo_nombre" class="form-control">

                            <label>Apellido paterno</label>
                            <input type="text" name="apellido_paterno" class="form-control" required>

                            <label>Apellido materno</label>
                            <input type="text" name="apellido_materno" class="form-control">
                        </div>

                        <!-- COLUMNA 2 -->
                        <div class="col-md-6">
                            <label>Fecha nacimiento</label>
                            <input type="date" name="fecha_nacimiento" class="form-control" required>

                            <label>Edad</label>
                            <input type="text" name="edad" class="form-control" disabledd>

                            <label>Dirección</label>
                            <input type="text" name="direccion" class="form-control" required>

                            <button type="submit" class="btn btn-primary mt-3" id="btn_registro">
                                Registrar
                            </button>
                        </div>
                    </div>

                </form>

            </div>

        </div>
        </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

            crossorigin="anonymous"></script>
        <script src="./assets/javascript/javascript.js"></script>
</body>
